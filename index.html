<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardust Snap — Oshani Hind</title>
  <meta name="description" content="An interactive universe where a name is written in stardust. Show an open hand to your webcam and it bursts into a beating heart.">
  <meta name="author" content="Oshani Hind De Silva">
  <meta name="theme-color" content="#02050b">
  <meta property="og:title" content="Stardust Snap">
  <meta property="og:description" content="A name written in stardust — snap with your hand to turn it into a heart.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@800&family=Poiret+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-tech">
  <!-- ===== Intro: boot → scanner → welcome ===== -->
  <div class="intro" id="intro">
    <canvas id="introFx"></canvas>
    <div class="boot" id="boot"></div>
    <div class="beam"><i></i><i></i><i></i></div>
    <div class="welcome">
      <p class="w1" data-text="WELCOME">WELCOME</p>
      <p class="w2">you have entered into</p>
      <h1 class="w3" data-text="">&nbsp;</h1>
    </div>
    <div class="hud" aria-hidden="true">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="radar"></div>
    </div>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="stamp" id="stamp">ACCESS GRANTED</div>
    <div class="sysinfo" id="sysinfo"></div>
    <button class="skip" type="button">SKIP ▸</button>
  </div>

  <canvas id="space"></canvas>

  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>

  <button class="top-btn game-btn" id="gameBtn" title="Games">▶ Games</button>
  <button class="top-btn sound-btn" id="soundBtn" title="Sound (M)">♪ Sound</button>
  <button class="top-btn theme-btn" id="themeBtn" title="Switch theme (T)">◐ Sakura</button>
  <div class="tagline">// written in code</div>

  <div class="cam">
    <button class="top-btn cam-btn" id="camBtn">◉ Turn on camera</button>
    <div class="cam-box" id="camBox">
      <video id="video" playsinline muted></video>
      <canvas id="handCanvas"></canvas>
    </div>
    <div class="cam-status" id="camStatus" hidden></div>
  </div>

  <div class="compass" id="compass" aria-hidden="true">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor">
      <circle cx="60" cy="60" r="56" stroke-width="2"/>
      <circle cx="60" cy="60" r="46" stroke-width="1" stroke-dasharray="2 4"/>
      <g id="cpRing"><path id="cpTicks" stroke-width="1.5"/>
        <text x="60" y="17" class="cp-n">N</text><text x="106" y="64" class="cp-l">E</text>
        <text x="60" y="112" class="cp-l">S</text><text x="14" y="64" class="cp-l">W</text></g>
      <g id="cpNeedle"><path d="M60 22L67 60H53Z" fill="#ff4fd8" stroke="none"/><path d="M60 98L67 60H53Z" fill="currentColor" stroke="none" opacity=".7"/></g>
      <circle cx="60" cy="60" r="4" fill="#02050b" stroke-width="2"/>
    </svg>
    <div class="cp-read" id="cpRead">000° N</div>
  </div>
  <div class="lyoko-sign" aria-hidden="true" title="Lyoko">
    <svg viewBox="0 0 100 140" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M50 4V44" stroke-width="7"/>
      <circle cx="50" cy="72" r="30" stroke-width="6"/>
      <circle cx="50" cy="72" r="18" stroke-width="5"/>
      <circle cx="50" cy="72" r="7" fill="currentColor" stroke="none"/>
      <path d="M30 98L10 130M70 98L90 130" stroke-width="7"/>
    </svg>
  </div>
  <div class="toast" id="toast" aria-live="polite"><span class="toast-emoji"></span><span class="toast-text"></span></div>

  <div class="ui" id="ui">
    <div class="gestures" role="toolbar" aria-label="Gestures">
      <button class="g" data-g="open"  title="Key 1"><span>✋</span><small>Heart</small></button>
      <button class="g" data-g="fist"  title="Key 2"><span>✊</span><small>Name</small></button>
      <button class="g" data-g="peace" title="Key 3"><span>✌️</span><small>Colour</small></button>
      <button class="g" data-g="point" title="Key 4"><span>☝️</span><small>Wand</small></button>
      <button class="g" data-g="thumb" title="Key 5"><span>👍</span><small>Fireworks</small></button>
      <button class="g" data-g="love"  title="Key 6"><span>🤟</span><small>Love</small></button>
    </div>
    <p class="hint">Show a gesture to the camera — or tap one</p>
  </div>

  <footer class="credit">Made with ◆ by <a href="https://github.com/HINDELGIRIYAGE" target="_blank" rel="noopener">Oshani Hind</a></footer>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center">Please enable JavaScript to see the stars</p></noscript>

  <script src="js/sound.js" defer></script>
  <script src="js/intro.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/compass.js" defer></script>
  <script src="js/minigames.js" defer></script>
  <script src="js/hand-tracking.js" defer></script>
</body>
</html>
